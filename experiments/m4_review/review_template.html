<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>M4 复核：56 封无 gold-Y 正袋</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#222; --muted:#777; --line:#e2dfd8;
          --y:#d98e04; --ybg:#fff4d6; --g:#2e7d32; --r:#c62828; --b:#1565c0; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 -apple-system,"PingFang SC",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:10; background:#2b2b2b; color:#fff;
           padding:8px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .stat { color:#cfcfcf; font-size:13px; }
  header button { background:#444; color:#fff; border:0; border-radius:4px;
                  padding:5px 12px; cursor:pointer; font-size:13px; }
  header button:hover { background:#5a5a5a; }
  main { max-width:980px; margin:18px auto 120px; padding:0 16px; }
  .meta-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
              background:var(--card); border:1px solid var(--line); border-radius:8px;
              padding:10px 14px; margin-bottom:14px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px;
           font-weight:600; }
  .b-a { background:#fdecea; color:var(--r); }
  .b-b { background:#e8f0fe; color:var(--b); }
  .b-c { background:#fff4d6; color:var(--y); }
  .b-stratum { background:#eee; color:#555; font-weight:400; }
  .prob-hi { color:var(--r); font-weight:700; }
  .prob-lo { color:var(--g); font-weight:700; }
  table.sents { width:100%; border-collapse:collapse; background:var(--card);
                border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  table.sents th { text-align:left; background:#efece5; font-size:12px; color:#666;
                   padding:6px 10px; font-weight:600; }
  table.sents td { padding:6px 10px; border-top:1px solid var(--line);
                   vertical-align:top; }
  tr.anyy td { background:#fffdf5; }
  tr.top1 td:first-child { border-left:3px solid var(--r); }
  .votes { display:inline-flex; gap:3px; }
  .v { width:19px; height:19px; border-radius:3px; text-align:center; font-size:11px;
       line-height:19px; font-weight:700; color:#fff; }
  .vY { background:var(--y); } .vN { background:#9e9e9e; } .v? { background:#cfcfcf; color:#666;}
  .gold { font-size:11px; color:var(--muted); }
  .attn { font-size:11px; color:var(--r); white-space:nowrap; }
  .idx { color:var(--muted); width:34px; }
  .reason { color:var(--muted); font-size:12px; }
  .decision { position:fixed; bottom:0; left:0; right:0; background:#2b2b2b;
              padding:12px 18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .decision button { border:0; border-radius:6px; padding:10px 22px; font-size:14px;
                     cursor:pointer; color:#fff; font-weight:600; }
  .decision .k { opacity:.7; font-weight:400; margin-right:6px; }
  #choose-a { background:var(--r); } #choose-b { background:var(--b); }
  #choose-c { background:var(--y); } #choose-skip { background:#616161; }
  .decision button:hover { filter:brightness(1.15); }
  .chosen { outline:3px solid #2e7d32; }
  .note { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 10px;
          font:inherit; margin-top:8px; }
  .guess-note { color:#555; font-size:13px; }
  .navq { color:#bbb; }
</style>
</head>
<body>
<header>
  <h1>M4 复核：56 封无 gold-Y 正袋</h1>
  <span class="stat" id="progress"></span>
  <button id="btn-export">导出结论 JSON</button>
  <button id="btn-jump">跳到下一条未决</button>
</header>
<main id="main"></main>
<div class="decision">
  <button id="choose-a"><span class="k">[1]</span>a · 标签噪声</button>
  <button id="choose-b"><span class="k">[2]</span>b · 分布式欺骗</button>
  <button id="choose-c"><span class="k">[3]</span>c · 集成假阴性</button>
  <button id="choose-skip"><span class="k">[0]</span>跳过/存疑</button>
</div>
<script>
const DATA = /*__DATA__*/null;
const LS_KEY = "m4_review_v1";
let cur = 0;
let verdicts = JSON.parse(localStorage.getItem(LS_KEY) || "{}");

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function vchip(v){ return `<span class="v v${v}">${v}</span>`; }

function render(i){
  cur = i;
  const e = DATA[i];
  const v = verdicts[e.email_id];
  const probCls = e.email_prob >= 0.9 ? "prob-hi" : (e.email_prob < 0.5 ? "prob-lo" : "");
  let rows = e.sentences.map(s => {
    const anyY = Object.values(s.votes).some(x => x === "Y");
    const isTop = e.top1 === s.idx;
    return `<tr class="${anyY?'anyy':''} ${isTop?'top1':''}">
      <td class="idx">${s.idx}</td>
      <td><span class="votes">${vchip(s.votes.a)}${vchip(s.votes.b)}${vchip(s.votes.c)}</span></td>
      <td>${esc(s.text)}${s.gold==='?'?' <span class="gold">[?]</span>':''}
          ${isTop?`<div class="attn">▲ 模型 top1（权重 ${e.top1_weight.toFixed(3)}）</div>`:''}
          ${s.reason?`<div class="reason">${esc(s.reason)}</div>`:''}</td>
    </tr>`;
  }).join("");
  document.getElementById("main").innerHTML = `
    <div class="meta-bar">
      <strong>#${i+1}/56 · 邮件 ${e.email_id}</strong>
      <span class="badge b-stratum">${esc(e.stratum)}</span>
      <span class="badge b-${e.initial_guess}">初判 ${e.initial_guess}</span>
      <span class="guess-note">${esc(e.guess_note)}</span>
      <span>句子数 ${e.n_sentences}${e.n_question?` · ? ${e.n_question}`:''} ·
        pass 曾标Y句数 ${e.anypass_y} · 有效句数 ${e.eff_n.toFixed(1)}</span>
      <span>模型邮件概率：<span class="${probCls}">${e.email_prob.toFixed(3)}</span></span>
      ${v?`<span class="badge b-${v.verdict==='skip'?'a':v.verdict} ${v.verdict==='skip'?'navq':''}">已判：${v.verdict}</span>`:'<span class="navq">未决</span>'}
    </div>
    <table class="sents">
      <tr><th>#</th><th>a/b/c</th><th>句子（黄色行＝至少一个 pass 标过 Y；红边＝模型 top1）</th></tr>
      ${rows}
    </table>
    <textarea class="note" id="note" placeholder="备注（可选，会一并保存）">${v?esc(v.note||""):""}</textarea>`;
  window.scrollTo(0,0);
  updateProgress();
}

function choose(verdict){
  const e = DATA[cur];
  const note = (document.getElementById("note")||{}).value || "";
  verdicts[e.email_id] = {verdict, note, index: cur,
    initial_guess: e.initial_guess};
  localStorage.setItem(LS_KEY, JSON.stringify(verdicts));
  if (cur < DATA.length-1) render(cur+1); else render(cur);
}

function nextUndecided(){
  for (let k=cur+1; k<DATA.length; k++)
    if (!verdicts[DATA[k].email_id]) { render(k); return; }
  for (let k=0; k<=cur; k++)
    if (!verdicts[DATA[k].email_id]) { render(k); return; }
  alert("全部已决");
}

function updateProgress(){
  const n = Object.keys(verdicts).filter(k => verdicts[k].verdict !== "skip").length;
  const ns = Object.keys(verdicts).filter(k => verdicts[k].verdict === "skip").length;
  document.getElementById("progress").textContent =
    `已判定 ${n}/56${ns?` · 跳过 ${ns}`:""}`;
}

function exportJson(){
  const payload = {exported_at: new Date().toISOString(), verdicts};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "m4_verdicts.json";
  a.click();
}

document.getElementById("choose-a").onclick = ()=>choose("a");
document.getElementById("choose-b").onclick = ()=>choose("b");
document.getElementById("choose-c").onclick = ()=>choose("c");
document.getElementById("choose-skip").onclick = ()=>choose("skip");
document.getElementById("btn-export").onclick = exportJson;
document.getElementById("btn-jump").onclick = nextUndecided;
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "TEXTAREA") return;
  if (ev.key === "1") choose("a");
  else if (ev.key === "2") choose("b");
  else if (ev.key === "3") choose("c");
  else if (ev.key === "0") choose("skip");
  else if (ev.key === "ArrowRight" && cur < DATA.length-1) render(cur+1);
  else if (ev.key === "ArrowLeft" && cur > 0) render(cur-1);
});
render(0);
</script>
</body>
</html>
