# Ablation: No temperature annealing (fixed tau=1.0)
data_dir: "phishingdata"
vocab_file: "phishingdata/ind_word.pickle"
keywords_file: "phishingdata/kwords_stem.json"
max_sentences: 100
max_tokens_per_sentence: 50
batch_size: 32
num_workers: 0

hidden_dim: 64
classifier_hidden: [128, 64]
attention_hidden: 64
use_sparse: true

device: "mps"
epochs: 10
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 2

temperature_init: 1.0
temperature_min: 1.0
temperature_decay: 1.0
lambda_sparse: 0.1
lambda_rule: 0.5

log_interval: 50
save_dir: "experiments/ablation_no_temp"
seed: 42
